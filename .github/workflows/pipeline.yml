# Стиль, тесты, контракты и сценарии проверяются до сборки. Только успешный
# push в main передаёт образ на VPS; pull request ничего не развёртывает.
# VPS после финала закрыт: публикация на него включается переменной репозитория
# DEPLOY_VPS=true. Без неё образ собирается и проверяется, но никуда не уходит, и CI
# остаётся зелёным — от этого зависит автодеплой публичного стенда Render.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Второй пуш в ту же ветку делает первый неактуальным, поэтому он отменяется.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Настоящий PostgreSQL для тестов журнала и сценариев на обеих СУБД.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10

    # Для каждого вызова uv в этой задаче. Иначе голый `uv run` прочитает
    # .python-version, пересоберёт окружение другим интерпретатором, и ветка матрицы
    # молча перестанет проверять ту версию, в честь которой названа.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Пароль известен только одноразовой базе задачи CI и больше нигде не действует.
      ZD_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Установка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --extra dev

      - run: uv run ruff check src tests scripts

      - run: uv run ruff format --check src tests scripts

      - run: uv run pytest

      # Модели, реестр, документ контракта и перечисления интерфейса порождаются из
      # JSON Schema. Правка схемы без перегенерации или правка сгенерированного руками
      # падает здесь, а не у потребителя сообщения.
      - name: Сгенерированное совпадает со схемой
        if: matrix.python-version == '3.12'
        run: uv run python scripts/check_generated.py

      - name: Версии контракта совместимы
        run: uv run python scripts/check_compat.py

      - name: Спецификация API совпадает с кодом
        run: uv run python scripts/export_openapi.py --check

      # Восемь обязательных ситуаций постановки со сверкой с ожиданиями, записанными
      # отдельно от входных событий.
      - name: Проверочные сценарии
        run: uv run python scripts/check_scenarios.py

  image:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Загружаем образ в Docker раннера. Именно эти байты передаются на VPS после
      # успешной сборки, без зависимости от публичности контейнерного реестра.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zero-defect:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ключ для SSH-деплоя
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VPS == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Передать и запустить проверенный образ
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VPS == 'true'
        env:
          DEPLOY_IMAGE: zero-defect:${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          docker save "$DEPLOY_IMAGE" | gzip -1 | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@135.106.196.206 \
              load
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@135.106.196.206 \
            "activate:${{ github.sha }}"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            http://135.106.196.206:8000/api/health
