# Стиль, тесты, согласованность сгенерированного и сценарии — на каждом пуше. Образ
# собирается только после зелёных проверок: `needs` не запустит сборку, если упала
# хоть одна.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Второй пуш в ту же ветку делает первый неактуальным, поэтому он отменяется.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Для каждого вызова uv в этой задаче. Иначе голый `uv run` прочитает
    # .python-version, пересоберёт окружение другим интерпретатором, и ветка матрицы
    # молча перестанет проверять ту версию, в честь которой названа.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Установка uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --extra dev

      - run: uv run ruff check src tests scripts

      - run: uv run ruff format --check src tests scripts

      - run: uv run pytest

      # Модели, реестр, документ контракта и перечисления интерфейса порождаются из
      # JSON Schema. Правка схемы без перегенерации или правка сгенерированного руками
      # падает здесь, а не у потребителя сообщения.
      - name: Сгенерированное совпадает со схемой
        if: matrix.python-version == '3.12'
        run: uv run python scripts/check_generated.py

      - name: Версии контракта совместимы
        run: uv run python scripts/check_compat.py

      - name: Спецификация API совпадает с кодом
        run: uv run python scripts/export_openapi.py --check

      # Восемь обязательных ситуаций постановки со сверкой с ожиданиями, записанными
      # отдельно от входных событий.
      - name: Проверочные сценарии
        run: uv run python scripts/check_scenarios.py

  image:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Образ собирается, но не публикуется: цель — убедиться, что запуск на чистой
      # машине воспроизводим.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zero-defect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
