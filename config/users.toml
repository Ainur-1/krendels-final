# Пользователи и роли. Идентификатор — это и логин. Имена условные: реальные
# персональные данные системе не нужны. Паролей здесь нет: в демонстрационном режиме
# пароль совпадает с логином (administrator / administrator), в рабочем его задаёт
# администратор, и в базе хранится только хеш.

