# Настройки сервиса. Каждое значение можно переопределить переменной окружения
# ZD_<СЕКЦИЯ>_<КЛЮЧ>, например ZD_STORAGE_PATH=/data/ledger.sqlite3.
#
# Все пороги здесь — проектные предположения: реальных производственных измерений у
# нас нет, и каждое значение требует проверки на предприятии.

[storage]
# Журнал событий. SQLite выбран для MVP: один файл, запуск на чистой машине без
# сервера БД. Хранилище спрятано за портом, замена на PostgreSQL описана в
# docs/architecture.md.
path = "var/zero_defect.sqlite3"

[security]
keys_dir = "var/keys"
# Профиль, которым защищаются новые записи. Старые записи проверяются тем профилем,
# которым были защищены, — он записан в каждой записи.
crypto_profile = "hybrid-pq-v1"
# Время жизни токена доступа, с.
token_ttl_s = 43200
# Демонстрационный режим: вход по выбору пользователя без токена и автозагрузка
# сценариев. На производстве выключается.
demo = true

[ingest]
# Событие считается поздним, если пришло позже этого срока после возникновения, с.
late_after_s = 300
# Время возникновения в будущем больше чем на столько — расхождение часов источника, с.
clock_skew_tolerance_s = 60
# Число параллельных обработчиков приёма. Порядок внутри изделия сохраняется при
# любом числе: события одного изделия всегда попадают в один обработчик.
workers = 1

[quality]
# Ниже этой уверенности «признаков не обнаружено» не считается подтверждением годности.
min_confidence = 0.6
# Окно, в котором состояние станка связывается с операцией: до начала и после
# завершения, с.
machine_window_s = 300

[shifts]
# Смены по умолчанию, если источник не передал смену сам. Время местное.
schedule = [
    { id = "S1", start = "08:00", end = "20:00" },
    { id = "S2", start = "20:00", end = "08:00" },
]
timezone_offset_h = 3

[integration]
# Какие адаптеры внешних систем включены. Новый адаптер подключается строкой здесь и
# регистрацией в zero_defect.integration.registry — без правки ядра.
enabled = ["mes_emulator"]

[integration.mes_emulator]
base_url = "http://127.0.0.1:8100"
timeout_s = 5
max_attempts = 5
