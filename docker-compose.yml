# Сервис, его база PostgreSQL и эмулятор внешней системы. Эмулятор — тот же образ с
# другой командой: отдельный процесс нужен, чтобы обмен шёл по сети, как с настоящей MES.
#
# Пароль базы берётся из .env (в репозиторий не попадает):
#   ZD_DB_PASSWORD=<пароль>
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: zero_defect
      POSTGRES_USER: zd
      POSTGRES_PASSWORD: ${ZD_DB_PASSWORD:?задайте ZD_DB_PASSWORD в файле .env}
    volumes:
      - zd-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zd -d zero_defect"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ZD_STORAGE_URL: postgresql+psycopg://zd:${ZD_DB_PASSWORD}@db:5432/zero_defect
      ZD_MES_EMULATOR_BASE_URL: http://emulator:8100
    volumes:
      # Ключи и якорь журнала — отдельно от базы: копия базы без ключей бесполезна.
      - zd-keys:/app/var
    depends_on:
      db:
        condition: service_healthy
      emulator:
        condition: service_started

  emulator:
    build: .
    command: ["uvicorn", "zero_defect.integration.emulator:app", "--host", "0.0.0.0", "--port", "8100"]
    # Сервис доступен приложению по имени emulator внутри сети Compose. Наружу порт
    # не публикуется: у эмулятора есть административные маршруты управления сбоями.

volumes:
  zd-db:
  zd-keys:
