<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero Defect</title>
  <link rel="stylesheet" href="/static/styles.css?v=0.5.5">
</head>
<body>
  <section id="login" class="login hidden">
    <div class="login-box">
      <div class="brand login-brand"><div class="logo">Z</div><h1>Zero Defect</h1></div>
      <p class="lead">Прослеживаемость изделия и разбор несоответствий на производстве.</p>
      <form id="password-form" class="login-form">
        <label>Логин <input name="user_id" autocomplete="username" required autofocus></label>
        <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Войти</button>
      </form>
      <!-- Демонстрационный вход по ролям: подставляет логин и пароль роли в форму выше.
           При встраивании в систему предприятия блок удаляется целиком — вход остаётся. -->
      <section id="demo-roles" class="demo-roles hidden">
        <p class="muted small">Демонстрационный режим. При выборе роли логин и пароль подставляются автоматически.</p>
        <div id="role-cards" class="role-grid"></div>
      </section>
    </div>
  </section>

  <div id="app" class="hidden">
    <header class="top">
      <div class="brand"><div class="logo">Z</div><b>Zero Defect</b></div>
      <button id="open-guide" class="btn small" title="Как пользоваться системой">Инструкция</button>
      <nav id="crumbs" class="crumbs"></nav>
      <div id="top-actions" class="row"></div>
      <div class="grow"></div>
      <label id="view-as-wrap" class="row muted small hidden" title="Показать экран глазами другой роли">как <select id="view-as"></select></label>
      <span id="user-chip" class="chip"></span>
      <button id="logout" class="btn small" title="Выйти">⏻</button>
    </header>

    <main id="admin-view" class="admin-page hidden"></main>

    <main id="plant-view" class="plant hidden"></main>

    <main id="line-view" class="line-layout hidden">
      <aside id="role-panel" class="card area-left"></aside>


      <section class="card area-graph">
        <div class="graph-toolbar">
          <div class="row"><button id="left-toggle" class="btn small hidden" title="Администрирование" aria-label="Открыть панель администрирования">☰</button><b id="line-title"></b><span id="moment-badge"></span></div>
          <div class="row">
            <select id="product-filter" aria-label="Изделие"></select>
            <button class="btn small" data-zoom="in" title="Приблизить">＋</button>
            <button class="btn small" data-zoom="out" title="Отдалить">－</button>
            <button class="btn small" data-zoom="fit" title="Вписать граф">⤢</button>
          </div>
        </div>
        <div id="focus-note" class="focus-note hidden"></div>
        <div class="graph-wrap"><svg id="graph" class="graph" role="img" aria-label="Граф линии"></svg><div id="graph-tip" class="graph-tip hidden"></div><div id="circle-pop" class="circle-pop hidden" role="dialog" aria-label="Проблемы этапа"></div></div>
        <div id="graph-legend" class="legend"></div>
      </section>

      <section id="timeline" class="card area-timeline"></section>

      <section id="details" class="card area-details"></section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/static/app.js?v=0.5.5"></script>
</body>
</html>
